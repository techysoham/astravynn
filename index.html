<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTRAVYNN · AERIS Mission Console</title>
<style>
:root{--bg:#05080f;--panel:rgba(9,14,26,.88);--p2:#0c1424;--line:#1b2638;--tx:#dbe6f3;--mu:#8092aa;--ac:#4fd1c5;--blue:#5aa9ff;--amber:#f5b942;--red:#ff5d6c;--org:#ff8a4c;
--ui:"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--num:Consolas,"SF Mono",Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.45 var(--ui);overflow:hidden}
canvas{display:block;position:fixed;inset:0}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;backdrop-filter:blur(8px);overflow:auto;z-index:3}
.mu{color:var(--mu)}.sm{font-size:12px}h3{font-size:13px;margin:14px 0 6px;color:var(--mu);font-weight:600}
button,select,input[type=search],input[type=text]{background:var(--p2);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
input[type=search],input[type=text],select{width:100%}button:hover:not(:disabled),select:hover{border-color:#3a4f6e}button.on{border-color:var(--ac);color:var(--ac)}
button.pri{background:var(--ac);color:#04121a;border-color:var(--ac);font-weight:600}button.pri:hover:not(:disabled){filter:brightness(1.1)}
button:disabled{opacity:.45;cursor:not-allowed}:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin:4px 0;cursor:pointer}.dot{width:9px;height:9px;border-radius:50%}
.kv{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:4px 0}.kv span:first-child{color:var(--mu)}.kv span:last-child,.num{font-variant-numeric:tabular-nums}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px}.hd h2{margin:0;font-size:17px}
.lnk{color:var(--ac);cursor:pointer;margin-left:8px;font-weight:400}
#top{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);z-index:6}
#brand{white-space:nowrap;line-height:1.1}#brand b{font-size:18px;letter-spacing:.14em;font-weight:700}#brand small{display:block;font-size:10.5px;color:var(--mu);letter-spacing:.02em}
#nav{display:flex;gap:2px;flex:1;overflow-x:auto}#nav button{border:0;background:none;color:var(--mu);padding:8px 7px;white-space:nowrap;font-size:13.5px}#nav button:hover{color:var(--tx)}#nav button.on{color:var(--tx);box-shadow:inset 0 -2px var(--ac);border-radius:0}
.badge{font-size:11.5px;padding:3px 9px;border-radius:12px;border:1px solid var(--line);white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
.badge.live{color:#7ff0a0;border-color:#2c6b44}.badge.cache{color:var(--amber);border-color:#6b5420}.badge.offline{color:var(--red);border-color:#6b2c34}
#clock{font-family:var(--num);color:var(--tx)}
#legend{left:12px;top:68px;width:232px;max-height:calc(100% - 140px)}
#obj{right:12px;top:68px;width:300px;max-height:calc(100% - 330px)}
#ev{right:12px;bottom:12px;width:300px}
#wx{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;z-index:3;font-size:12.5px;flex-wrap:wrap;justify-content:center;max-width:62%}
#wx span{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 12px;white-space:nowrap}
#zoom{position:fixed;left:12px;bottom:12px;display:flex;gap:6px;z-index:3}
#view{position:fixed;inset:56px 0 0 0;background:#05080f;overflow:auto;padding:22px;z-index:5}
#vc{max-width:1120px;margin:0 auto}#vc h1{margin:0 0 4px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin:14px 0}
.card{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:10px 14px}.card b{white-space:nowrap;display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}.card span{color:var(--mu);font-size:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.box{background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0}
.warn{border-color:#6b5420;background:#1a1608;color:#f0d9a0}.warn b{color:var(--amber)}.note{border-left:3px solid var(--blue);padding:4px 10px;color:var(--mu);margin:8px 0;font-size:13px}
.item{padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}.item:hover{background:#0b1424}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:var(--mu);font-weight:500}td,th{padding:6px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
tr.item.sel{background:#0f2030;box-shadow:inset 3px 0 var(--ac)}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;font-weight:600;color:#06101a}
.sev-c{color:var(--red)}.sev-h{color:var(--org)}.sev-e{color:var(--amber)}.sev-m,.sev-l{color:var(--mu)}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}.ctl label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.bar{width:100%;height:5px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
#load{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9;text-align:center;padding:20px}
#load .bar{width:240px;margin:12px auto 0}
code,.tle{font:12px var(--num);color:#a9c7e8}.tle{white-space:pre-wrap;word-break:break-all;background:#070d18;border:1px solid var(--line);border-radius:6px;padding:8px}
@media(max-width:820px){#ev,#wx,.badge{display:none}#top{height:auto;flex-wrap:wrap;gap:2px 10px;padding:6px 10px}#brand small{display:none}#nav{order:3;flex-basis:100%}#view{inset:84px 0 0 0;padding:14px}#legend{top:92px;width:190px}#obj{top:auto;bottom:12px;max-height:45%;width:auto;left:12px;right:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}#vc.fx{animation:fadein .28s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s both}
@keyframes dr{to{stroke-dashoffset:0}}.draw{stroke-dasharray:2400;stroke-dashoffset:2400;animation:dr 1.3s ease-out forwards}
#tip{position:fixed;display:none;z-index:8;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:12px;pointer-events:none}
@media(prefers-reduced-motion:reduce){.pop,#vc.fx{animation:none!important}.draw{animation:none!important;stroke-dashoffset:0}}
</style></head><body>
<div id="load"><div><b style="font-size:22px;letter-spacing:.14em">ASTRAVYNN</b><div class="mu" style="margin-top:6px" id="lt">Loading libraries…</div><div class="bar"><i id="lb"></i></div></div></div>

<header id="top"><div id="brand"><b>ASTRAVYNN</b><small>AERIS Mission Console · Space Situational Awareness</small></div>
<nav id="nav"><button data-v="globe" class="on">Live Globe</button><button data-v="det">Satellite Details</button><button data-v="conj">Conjunction Assessment</button><button data-v="risk">Risk Analysis</button><button data-v="scn">Maneuver Scenario</button><button data-v="man">Maneuver Tracker</button><button data-v="sys">Method</button></nav>
<span class="badge" id="src">Starting…</span></header>

<div class="panel" id="legend"><div class="hd" id="lgh" style="cursor:pointer"><b>Layers</b><span class="mu" id="lgt">hide</span></div>
<div id="lgb"><input type="search" id="q" placeholder="Search name or NORAD id, then Enter" style="margin-top:8px">
<h3>Tracks</h3><label class="row"><input type="checkbox" id="tr"> Show selected orbit path</label>
<h3>Orbits <span class="lnk" data-o="all">All</span><span class="lnk" data-o="none">None</span></h3><div id="regs"></div>
<h3>Object classes</h3><div id="cats"></div>
<h3>Simulation clock</h3><select id="speed"><option value="1">Real time</option><option value="60" selected>60× faster</option><option value="600">600× faster</option><option value="0">Paused</option></select>
<button id="now" style="margin-top:6px;width:100%">Reset to now</button></div></div>

<aside class="panel" id="obj" hidden><div class="hd"><h2 id="sname"></h2><span><button id="star" title="Highlight on globe">☆</button> <button id="cls" title="Close">✕</button></span></div>
<div class="mu" id="sub"></div><div id="info"></div>
<div style="display:flex;gap:6px;margin-top:8px"><button id="focus" style="flex:1">Focus</button><button id="trackbtn" style="flex:1">Orbit path</button></div>
<div style="display:flex;gap:6px;margin-top:6px"><button id="btnDet" style="flex:1">Full details</button><button id="btnConj" class="pri" style="flex:1">Screen conjunctions</button></div></aside>

<div class="panel" id="ev"><div class="hd"><b>Catalog status</b><span id="wins"><button data-w="24" class="on" title="Maneuver count window">24h</button> <button data-w="48">48h</button></span></div>
<div id="evc" style="margin-top:6px"></div><div class="mu sm" id="live" style="margin-top:6px"></div></div>

<div id="wx"><span id="clock">--</span><span id="status">Loading…</span><span id="kp"></span><span id="act"></span></div>
<div id="tip"></div>
<div id="zoom"><button id="ar" title="Auto-rotate the globe">⟳ Rotate</button><button id="zi">+</button><button id="zo">−</button><button id="rv">Reset view</button></div>
<section id="view" hidden><div id="vc"></div></section>

<script>
(function(){
const L=[['vendor/three.min.js','https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'],
['vendor/OrbitControls.js','https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js'],
['vendor/satellite.min.js','https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js'],['astra_core.js']];
window.LIBSRC={};
const one=u=>new Promise(r=>{const s=document.createElement('script');s.src=u;s.onload=()=>r(true);s.onerror=()=>{s.remove();r(false)};document.head.appendChild(s)});
(async()=>{for(const [loc,cdn] of L){let ok=await one(loc);LIBSRC[loc]=ok?'local file':'';
  if(!ok&&cdn){ok=await one(cdn);LIBSRC[loc]=ok?'CDN (internet)':'FAILED'}
  if(!ok){document.getElementById('lt').innerHTML='Could not load <b>'+loc+'</b>.<br>Connect to the internet once and run <code>python setup_offline.py</code>, then reload.';return}}
 const s=document.createElement('script');s.textContent=document.getElementById('app').textContent;document.body.appendChild(s)})();
})();
</script>
<script type="text/plain" id="app">
const $=id=>document.getElementById(id);
const CATS={starlink:['Starlink','#5ec8ff'],oneweb:['OneWeb','#b79bff'],gps:['GPS','#7be3a8'],debris:['Debris','#ff7a59'],other:['Other active','#cdd6e4']};
const REGS=['LEO','MEO','GEO','HEO'],DEFAULT_ON=1;
const catOn={starlink:1,oneweb:1,gps:1,debris:1,other:1},regOn={LEO:1,MEO:1,GEO:1,HEO:1};
const STRAT=[[53323,'COSMOS 2558','Inspector'],[51511,'COSMOS 2553','Inspector'],[55131,'SJ-23','Inspector'],[49330,'SJ-21','Inspector'],[41838,'SHIJIAN-17','Inspector'],[25544,'ISS (ZARYA)','Infrastructure'],[48274,'TIANGONG','Infrastructure'],[20580,'HUBBLE','Science']];
const utcStr=t=>new Date(t).toISOString().slice(0,19).replace('T',' ')+' UTC';
const FALLBACK=[{n:"ISS (ZARYA)",a:"1 25544U 98067A   24001.50000000  .00016717  00000-0  10270-3 0  9990",b:"2 25544  51.6400 247.4627 0006703 130.5360 325.0288 15.50000000 10000",g:"active"}];
let cfg={units:'km',time:'UTC'},wl=new Set();
try{Object.assign(cfg,JSON.parse(localStorage.getItem('ow_cfg')||'{}'));wl=new Set(JSON.parse(localStorage.getItem('ow_wl')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('ow_cfg',JSON.stringify(cfg));localStorage.setItem('ow_wl',JSON.stringify([...wl]))}catch(e){}};
const dist=k=>cfg.units==='mi'?(k*0.621371).toFixed(0)+' mi':k.toFixed(0)+' km';
const dd=k=>cfg.units==='mi'?(k*0.621371).toFixed(1)+' mi':k.toFixed(1)+' km';
let S=[],pos,col,siz,geom,points,sel=-1,simMs=Date.now(),speed=60,query='',showTrack=false,pairs=[],pairTotal=0,winH=24,decay=0,ny=0,curView='globe';
let ok,E,Vl,vis,META={},byId=new Map(),thr=25,samec=true,mf={type:'',win:24};

// ---------- scene ----------
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,1000);camera.position.set(0,8,24);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enablePan=false;controls.minDistance=8;controls.maxDistance=120;controls.enableDamping=true;
const earth=new THREE.Mesh(new THREE.SphereGeometry(6.371,64,64),new THREE.MeshBasicMaterial({color:0x1d3a5c}));scene.add(earth);
const _tl=new THREE.TextureLoader(),_tex=t=>{earth.material.map=t;earth.material.color.set(0xb4c0d2);earth.material.needsUpdate=true};_tl.load('vendor/earth.jpg',_tex,undefined,()=>_tl.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg',_tex,undefined,()=>{}));
const trackLine=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.7}));scene.add(trackLine);
const pairLines=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0xffc857}));scene.add(pairLines);

// ---------- data ----------
function classify(s){const n=s.n.toUpperCase();if(s.g!=='active'||/ DEB|DEBRIS| R\/B/.test(n))return'debris';if(n.startsWith('STARLINK'))return'starlink';if(n.startsWith('ONEWEB'))return'oneweb';if(n.includes('NAVSTAR')||n.startsWith('GPS'))return'gps';return'other'}
const sma=r=>Math.cbrt(398600.4418/((r.no/60)**2));
const ap=(r,sg)=>sma(r)*(1+sg*r.ecco)-6371;
function regime(r){const a=sma(r);if(r.ecco>.25)return'HEO';if(Math.abs(a-42164)<600)return'GEO';return a-6371<2000?'LEO':a<42000?'MEO':'HEO'}
function epoch(r){const y=r.epochyr<57?2000+r.epochyr:1900+r.epochyr;return Date.UTC(y,0,1)+(r.epochdays-1)*864e5}
async function load(){
  let list;
  try{
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),60000);
    const r=await fetch('/api/catalog',{signal:ctl.signal});clearTimeout(to);if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();META=j;list=j.sats;
    const when=j.fetched?utcStr(j.fetched*1000):'unknown time',age=j.age_h==null?'':` · age ${j.age_h<48?j.age_h.toFixed(1)+' h':(j.age_h/24).toFixed(1)+' d'}`;
    if(list&&list.length){SRC=j.source==='live'?{mode:'live',label:'LIVE · '+when.slice(0,16)+' UTC',detail:'Fresh download from CelesTrak at '+when+'.'}:
      {mode:'cache',label:'CACHED · '+when.slice(0,16)+' UTC',detail:'Real CelesTrak data from the local cache, downloaded '+when+age+'. '+(j.note||'')}}
  }catch(e){console.warn('catalog fetch failed',e);list=null}
  if(!list||!list.length){list=FALLBACK;META={};SRC={mode:'offline',label:'OFFLINE SAMPLE (1 object)',detail:'Backend unreachable or catalog empty. Run python server.py. Showing one built-in sample TLE; it is illustrative and its epoch is old.'}}
  const yy=String(new Date().getUTCFullYear()%100).padStart(2,'0');
  for(let k=0;k<list.length;k++){const s=list[k],rec=satellite.twoline2satrec(s.a,s.b);
    if(!rec.error){const o={n:s.n,a:s.a,b:s.b,id:s.a.slice(2,7).trim(),rec,cat:classify(s),reg:regime(rec),ep:epoch(rec),rp:ap(rec,-1),ra:ap(rec,1)};S.push(o);if(o.rp<250)decay++;if(s.a.slice(9,11)===yy)ny++}
    if(k%1500===0){$('lb').style.width=(k/list.length*100)+'%';await new Promise(r=>setTimeout(r))}}
  const N=S.length;byId=new Map(S.map((s,i)=>[s.id,i]));
  pos=new Float32Array(N*3);vel=new Float32Array(N*3);col=new Float32Array(N*3);siz=new Float32Array(N);ok=new Uint8Array(N);E=new Float64Array(N*3);Vl=new Float64Array(N*3);vis=new Uint8Array(N);
  S.forEach((s,i)=>new THREE.Color(CATS[s.cat][1]).toArray(col,i*3));
  geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.BufferAttribute(pos,3));geom.setAttribute('color',new THREE.BufferAttribute(col,3));geom.setAttribute('size',new THREE.BufferAttribute(siz,1));geom.setAttribute('vel',new THREE.BufferAttribute(vel,3));
  points=new THREE.Points(geom,new THREE.ShaderMaterial({uniforms:{pr:{value:renderer.getPixelRatio()},dt:{value:0}},transparent:true,
    vertexShader:'attribute float size;attribute vec3 color;attribute vec3 vel;varying vec3 c;uniform float pr;uniform float dt;void main(){c=color;gl_PointSize=size*pr;gl_Position=projectionMatrix*modelViewMatrix*vec4(position+vel*dt,1.);}',
    fragmentShader:'varying vec3 c;void main(){vec2 p=gl_PointCoord-.5;if(dot(p,p)>.25)discard;gl_FragColor=vec4(c,1.);}'}));
  points.frustumCulled=false;scene.add(points);
  setStatus(list.length.toLocaleString()+' objects');const kp=META.kp==null?null:+META.kp;
  $('kp').textContent=kp==null?'Space weather: n/a':`Space weather: Kp ${kp.toFixed(1)} · ${kp>=5?'Storm':kp>=4?'Active':'Quiet'}`;
  $('load').style.display='none';step();screen();
}

// ---------- propagation / filters ----------
function step(){
  const d=new Date(simMs);
  for(let i=0;i<S.length;i++){let pv;try{pv=satellite.propagate(S[i].rec,d)}catch(e){pv={}}
    const p=pv.position,v=pv.velocity;
    if(p&&isFinite(p.x)&&v){ok[i]=1;E[3*i]=p.x;E[3*i+1]=p.y;E[3*i+2]=p.z;Vl[3*i]=v.x;Vl[3*i+1]=v.y;Vl[3*i+2]=v.z;pos[3*i]=p.x/1000;pos[3*i+1]=p.z/1000;pos[3*i+2]=-p.y/1000;vel[3*i]=v.x/1000;vel[3*i+1]=v.z/1000;vel[3*i+2]=-v.y/1000}else ok[i]=0}
  geom.attributes.position.needsUpdate=true;geom.attributes.vel.needsUpdate=true;lastStepSim=simMs;applyFilters();info();updEvLine();
}
function applyFilters(){
  let n=0,deb=0;
  for(let i=0;i<S.length;i++){const s=S[i],m=!query||s.n.toLowerCase().includes(query)||s.id===query;
    const v=(ok[i]&&catOn[s.cat]&&regOn[s.reg]&&m)||(i===sec&&ok[i]);vis[i]=v?1:0;siz[i]=!v?0:i===sel?10:i===sec?9:wl.has(s.id)?6:3.6;if(v){n++;if(s.cat==='debris')deb++}}
  geom.attributes.size.needsUpdate=true;updateEv(n,deb);
}
function updateEv(n,deb){
  const ev=META.maneuvers||[],m=ev.filter(e=>e.t>Date.now()-winH*36e5).length;
  const rows=[[`Maneuvers (${winH} h)`,ev.length?m:'-'],[`Pairs < ${thr} km now (snapshot)`,pairTotal],['Decaying orbits (perigee < 250 km)',decay],['Debris shown',deb],['Launched this year',ny]];
  $('evc').innerHTML=rows.map(r=>`<div class="kv"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('');
  $('live').textContent=`Live tracking: ${n.toLocaleString()} of ${S.length.toLocaleString()} objects shown`;
}

// ---------- proximity right now (spatial hash) ----------
function screen(){
  const cell=thr,M=new Map(),K=(x,y,z)=>((x+10000)*20000+(y+10000))*20000+(z+10000),idx=[];
  for(let i=0;i<S.length;i++)if(vis[i])idx.push(i);
  for(const i of idx){const k=K(Math.floor(E[3*i]/cell),Math.floor(E[3*i+1]/cell),Math.floor(E[3*i+2]/cell));(M.get(k)||M.set(k,[]).get(k)).push(i)}
  const out=[];
  for(const i of idx){const cx=Math.floor(E[3*i]/cell),cy=Math.floor(E[3*i+1]/cell),cz=Math.floor(E[3*i+2]/cell);
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)for(let dz=-1;dz<=1;dz++){const b=M.get(K(cx+dx,cy+dy,cz+dz));if(!b)continue;
      for(const j of b){if(j<=i)continue;const d=Math.hypot(E[3*i]-E[3*j],E[3*i+1]-E[3*j+1],E[3*i+2]-E[3*j+2]);if(d>thr)continue;
        if(samec&&S[i].cat===S[j].cat&&(S[i].cat==='starlink'||S[i].cat==='oneweb'))continue;
        out.push({i,j,d,rv:Math.hypot(Vl[3*i]-Vl[3*j],Vl[3*i+1]-Vl[3*j+1],Vl[3*i+2]-Vl[3*j+2])})}}}
  out.sort((a,b)=>a.d-b.d);pairTotal=out.length;pairs=out.slice(0,15);
  const a=new Float32Array(pairs.length*6);pairs.forEach((p,k)=>a.set([pos[3*p.i],pos[3*p.i+1],pos[3*p.i+2],pos[3*p.j],pos[3*p.j+1],pos[3*p.j+2]],k*6));
  pairLines.geometry.setAttribute('position',new THREE.BufferAttribute(a,3));

// ---- Conjunction Assessment (real SGP4 screening in a Web Worker)
function runScreen(){
  if(run.primary<0||!ok[run.primary]){run.msg='Pick a primary object whose TLE propagates.';render();return}
  const pi=run.primary,P=S[pi],m=Math.max(30,run.thr),c=[];let trunc=0;
  S.forEach((s,j)=>{if(j!==pi&&s.ra+m>=P.rp&&s.rp-m<=P.ra){if(c.length<12000)c.push(j);else trunc++}});
  if(wk)wk.terminate();
  const t0=Date.now(),hours=run.hours,thr=run.thr,snap=META.fetched?utc(META.fetched*1000):'built-in sample';
  run.radar=prepRadar(P,c,t0);run.rName=P.n;run.state='running';run.msg=`Screening ${c.length.toLocaleString()} objects in ${P.n}'s altitude band…`;run.progress=0;evSel=-1;render();
  try{wk=new Worker('screen_worker.js')}catch(e){run.state='idle';run.msg='Web Worker failed to start: '+e.message;render();return}
  wk.onmessage=e=>{const d=e.data;
    if(d.progress!==undefined){run.progress=d.progress;const b=$('cprog');if(b)b.style.width=Math.round(d.progress*100)+'%';const m=$('cmsg');if(m)m.textContent=`Screening… ${Math.round(d.progress*100)}% (${((Date.now()-t0)/1000).toFixed(0)} s)`;return}
    if(d.error){run.state='idle';run.msg='Screening error: '+d.error;render();return}
    const ev=d.res.map(r=>{const j=c[r.j],o=S[j],tier=AC.tierOf(r.miss),agep=(r.tca-P.ep)/864e5,ages=(r.tca-o.ep)/864e5;
      return{...r,j,tier,rtn:AC.rtn(r.rp,r.vp,r.rs,r.vs),agep,ages,low:Math.max(agep,ages)>AC.AGE_LIMIT_DAYS}}).sort((a,b)=>a.miss-b.miss);
    R={pIdx:pi,pName:P.n,pId:P.id,t0,hours,thr,n:c.length,trunc,ms:Date.now()-t0,events:ev,snap};run.state='done';run.progress=1;run.msg='Completed in '+((Date.now()-t0)/1000).toFixed(1)+' s.';evSel=ev.length?0:-1;scnSrc='real';scRes=null;
    if(curView==='conj'||curView==='risk')render()};
  wk.onerror=e=>{run.state='idle';run.msg='Worker failed: '+(e.message||'could not load screen_worker.js / satellite.js');render()};
  wk.postMessage({p:[P.a,P.b],c:c.map(j=>[S[j].a,S[j].b]),t0,hours,step:30,thr});
}

  if(a==='mtscreen'){run.primary=i;run.radar=null;select(i);go('conj');return}
  if(a==='setp'){run.primary=i;run.radar=null;run.msg='';if(i!==sel)select(i);render();return}
  if(a==='seld'){select(i);render();return}
  if(a==='screenSel'){run.primary=sel;go('conj');return}
  if(a==='ev'){evSel=+t.dataset.k;scnSrc='real';scRes=null;render();return}
  if(a==='evgo'){evSel=+t.dataset.k;scnSrc='real';go('conj');return}
  if(a==='show')return showOnGlobe();
  if(a==='scn'){scnSrc='real';scRes=null;go('scn');return}
  if(a==='exp')return exportEv();
  if(a==='demo')return makeDemo();
  if(a==='goto')return go(t.dataset.v);
  if(i!==undefined&&!isNaN(i)){go('globe');select(i)}};
$('vc').addEventListener('input',e=>{const t=e.target;
  if(t.id==='cq'||t.id==='dq'){const q=t.value.trim().toLowerCase(),box=$(t.id==='cq'?'cres':'dres');if(q.length<2){box.innerHTML='';return}
    const m=[];for(let i=0;i<S.length&&m.length<8;i++)if(ok[i]&&(S[i].n.toLowerCase().includes(q)||S[i].id===q))m.push(i);
    box.innerHTML=m.map(i=>`<div class="item" data-act="${t.id==='cq'?'setp':'seld'}" data-i="${i}">${esc(S[i].n)} <span class="mu sm">NORAD ${S[i].id} · ${S[i].reg} · ${CATS[S[i].cat][0]}</span></div>`).join('')||'<div class="mu sm">No match</div>'}
  if(t.dataset.m==='q'){mt.q=t.value;render();const q=document.querySelector('[data-m="q"]');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}return}
  if(t.dataset.sp==='dv'){sc.dv=+t.value;const l=$('dvl');if(l)l.textContent=sc.dv.toFixed(2)+' m/s'}});
$('vc').addEventListener('change',e=>{const t=e.target;
  if(t.dataset.m){const k=t.dataset.m;if(k==='strat')mt.strat=t.checked;else if(k==='win')mt.win=+t.value;else mt[k]=t.value;if(k==='win')simCache=null;render();return}
  if(t.dataset.p==='hours')run.hours=+t.value;else if(t.dataset.p==='thr')run.thr=+t.value;
  else if(t.dataset.p==='evsel'){if(t.value==='demo')scnSrc='demo';else{scnSrc='real';evSel=+t.value.slice(1)}scRes=null;render()}
  else if(t.dataset.sp){const k=t.dataset.sp;if(k==='ax')sc.ax=t.value;else sc[k]=+t.value;scRes=null;render()}});
$('btnDet').onclick=()=>go('det');
$('btnConj').onclick=()=>{if(sel<0)return;run.primary=sel;go('conj')};
addEventListener('error',e=>{const s=$('src');if(s&&!window.__errShown){window.__errShown=1;console.error('ASTRAVYNN runtime error:',e.message)}});

// ---------- globe hover tooltip + auto-rotate ----------
(function(){const tip=$('tip'),cv=renderer.domElement;let hv=0;
 cv.addEventListener('pointermove',e=>{const n=performance.now();if(n-hv<70||!S.length||e.buttons)return;hv=n;
  const v=new THREE.Vector3(),cp=camera.position;let best=-1,bd=70;
  for(let i=0;i<S.length;i++){if(!vis[i])continue;v.set(pos[3*i],pos[3*i+1],pos[3*i+2]);
   const dx=v.x-cp.x,dy=v.y-cp.y,dz=v.z-cp.z,L2=dx*dx+dy*dy+dz*dz,t=Math.max(0,Math.min(1,-(cp.x*dx+cp.y*dy+cp.z*dz)/L2));
   if(Math.hypot(cp.x+dx*t,cp.y+dy*t,cp.z+dz*t)<6.3)continue;v.project(camera);const sx=(v.x+1)/2*innerWidth,sy=(1-v.y)/2*innerHeight,d=(sx-e.clientX)**2+(sy-e.clientY)**2;if(d<bd){bd=d;best=i}}
  if(best>=0){tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-230)+'px';tip.style.top=e.clientY+14+'px';cv.style.cursor='pointer';
   tip.innerHTML=`<b>${esc(S[best].n)}</b><br><span class="mu">${CATS[S[best].cat][0]} · ${S[best].reg} · NORAD ${S[best].id}<br>altitude ${(Math.hypot(E[3*best],E[3*best+1],E[3*best+2])-6371).toFixed(0)} km · ${Math.hypot(Vl[3*best],Vl[3*best+1],Vl[3*best+2]).toFixed(2)} km/s</span>`}
  else{tip.style.display='none';cv.style.cursor=''}});
 cv.addEventListener('pointerleave',()=>tip.style.display='none');
 $('ar').onclick=()=>{controls.autoRotate=!controls.autoRotate;controls.autoRotateSpeed=.7;$('ar').classList.toggle('on',controls.autoRotate)}})();

// ---------- loop ----------
let last=performance.now(),acc=0,acc2=0;
function frame(t){
  const dt=t-last;last=t;simMs+=dt*speed;acc+=dt;acc2+=dt;
  earth.rotation.y=satellite.gstime(new Date(simMs));
  const d=new Date(simMs);$('clock').textContent=d.toISOString().replace('T',' ').slice(0,19)+' UTC'+(speed===0?' ⏸':speed>1?' ×'+speed:'');
  if(S.length){if(acc>(speed>1?300:1000)){acc=0;step()}if(acc2>5000){acc2=0;screen()}}
  if(geom&&sel>=0&&vis[sel]){const k=1+.3*Math.sin(t/220);siz[sel]=10*k;if(sec>=0&&vis[sec])siz[sec]=9*k;geom.attributes.size.needsUpdate=true}
  if(points&&points.material.uniforms&&points.material.uniforms.dt)points.material.uniforms.dt.value=Math.min(40,Math.max(0,(simMs-lastStepSim)/1000));
  controls.update();renderer.render(scene,camera);requestAnimationFrame(frame);
}
if(innerWidth<820){$('lgb').hidden=true;$('lgt').textContent='show'}
requestAnimationFrame(frame);load();

</script></body></html>
